<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Inter", "Segoe UI", Arial, sans-serif;
        min-height: 100vh;
        padding: 40px 20px;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        color: #1e293b;
    }

    .container {
        max-width: 1000px;
        margin: auto;
        background: rgba(255, 255, 255, 0.95);
        padding: 35px;
        border-radius: 20px;
        box-shadow:
            0 20px 50px rgba(15, 23, 42, 0.08),
            0 5px 15px rgba(15, 23, 42, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.8);
    }

    /* Header */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 35px;
        padding-bottom: 25px;
        border-bottom: 1px solid #e2e8f0;
    }

    .header-content h1 {
        font-size: 30px;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 6px;
    }

    .header-content p {
        color: #64748b;
        font-size: 14px;
    }

    .header-icon {
        width: 55px;
        height: 55px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 15px;
        background: linear-gradient(135deg, #06b6d4, #2563eb);
        color: white;
        font-size: 25px;
        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
    }

    /* Section */
    .section {
        margin-bottom: 35px;
    }

    .section-title {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
    }

    .section-title h2 {
        font-size: 20px;
        color: #0f172a;
    }

    .section-title span {
        width: 8px;
        height: 8px;
        background: #06b6d4;
        border-radius: 50%;
        box-shadow: 0 0 0 5px rgba(6, 182, 212, 0.1);
    }

    /* Form Card */
    .form-card {
        padding: 25px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 15px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 18px;
        align-items: end;
    }

    .form-group {
        margin-bottom: 0;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 600;
        color: #475569;
    }

    .form-group input {
        width: 100%;
        height: 46px;
        padding: 0 14px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        background: white;
        color: #1e293b;
        font-size: 14px;
        outline: none;
        transition: all 0.2s ease;
    }

    .form-group input::placeholder {
        color: #94a3b8;
    }

    .form-group input:focus {
        border-color: #06b6d4;
        box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.12);
    }

    .error {
        display: block;
        color: #ef4444;
        font-size: 12px;
        margin-top: 6px;
        min-height: 16px;
    }

    /* Button */
    button {
        height: 46px;
        padding: 0 22px;
        background: linear-gradient(135deg, #06b6d4, #2563eb);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 6px 15px rgba(37, 99, 235, 0.2);
    }

    button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(37, 99, 235, 0.25);
    }

    button:active:not(:disabled) {
        transform: translateY(0);
    }

    button:disabled {
        background: #cbd5e1;
        box-shadow: none;
        cursor: not-allowed;
    }

    /* Divider */
    .divider {
        height: 1px;
        background: #e2e8f0;
        margin: 35px 0;
    }

    /* Table */
    .table-wrapper {
        overflow-x: auto;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        background: white;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        padding: 15px 18px;
        background: #f8fafc;
        color: #64748b;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        text-align: left;
        border-bottom: 1px solid #e2e8f0;
    }

    td {
        padding: 16px 18px;
        color: #334155;
        font-size: 14px;
        border-bottom: 1px solid #f1f5f9;
    }

    tbody tr {
        transition: background 0.2s ease;
    }

    tbody tr:hover {
        background: #f8fafc;
    }

    tbody tr:last-child td {
        border-bottom: none;
    }

    td:first-child {
        color: #64748b;
        font-weight: 600;
    }

    td:nth-child(2) {
        font-weight: 600;
        color: #0f172a;
    }

    td:nth-child(3) {
        color: #0891b2;
        font-weight: 700;
    }

    /* Pagination */
    .pagination {
        margin-top: 22px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
    }

    .pagination button {
        min-width: 110px;
    }

    #pageInfo {
        font-size: 14px;
        color: #64748b;
        font-weight: 600;
        padding: 10px 18px;
        background: #f8fafc;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        body {
            padding: 20px 12px;
        }

        .container {
            padding: 22px;
            border-radius: 16px;
        }

        .header {
            margin-bottom: 25px;
        }

        .header-content h1 {
            font-size: 24px;
        }

        .header-icon {
            width: 45px;
            height: 45px;
            font-size: 20px;
        }

        .form-grid {
            grid-template-columns: 1fr;
        }

        .form-group {
            margin-bottom: 5px;
        }

        .form-grid button {
            width: 100%;
        }

        .pagination {
            flex-wrap: wrap;
            justify-content: center;
        }

        #pageInfo {
            order: -1;
            width: 100%;
            text-align: center;
        }
    }

    @media (max-width: 480px) {
        .container {
            padding: 18px;
        }

        .header-content h1 {
            font-size: 21px;
        }

        .section-title h2 {
            font-size: 18px;
        }

        th,
        td {
            padding: 12px;
        }
    }
</style>

<!-- Header -->
<div class="header">
    <div class="header-content">
        <h1>Product Manager</h1>

    </div>

    <div class="header-icon">

<!-- Add Product Section -->
<div class="section">

    <div class="section-title">
        <span></span>
        <h2>Add New Product</h2>
    </div>

    <div class="form-card">

        <form id="productForm">

            <div class="form-grid">

                <div class="form-group">
                    <label for="name">Product Name</label>

                    <input
                        type="text"
                        id="name"

                    <span id="priceError" class="error"></span>
                </div>

                    + Add Product
                </button>

            </div>

    </div>

</div>

<div class="divider"></div>

<!-- Product List -->
<div class="section">

    <div class="section-title">
        <span></span>
        <h2>Product Inventory</h2>
    </div>

    <div class="table-wrapper">

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Product Name</th>
                <th>Price</th>

            <tbody id="productTableBody">

        <button
            id="prevBtn"
            onclick="changePage(-1)"
            disabled

        </button>

        <span id="pageInfo">

        >

        </button>

</div>

</div>

<script>
    let currentPage = 0;
    const pageSize = 5;

    // Load products when the page loads
    document.addEventListener("DOMContentLoaded", () => {
        fetchProducts(currentPage);
    });

    // Handle Form Submission
    document.getElementById("productForm").addEventListener("submit", function(event) {
        event.preventDefault();

        // Clear previous errors
        document.getElementById("nameError").innerText = "";
        document.getElementById("priceError").innerText = "";

        const product = {
            name: document.getElementById("name").value,
            price: parseFloat(document.getElementById("price").value)
        };

        fetch('/api/products', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(product)
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(err => {
                    throw err;
                });
            }

            return response.json();
        })
        .then(data => {
            alert("Product added successfully!");

            document.getElementById("productForm").reset();

            fetchProducts(currentPage);
        })
        .catch(errors => {

            if (errors.name) {
                document.getElementById("nameError").innerText = errors.name;
            }

            if (errors.price) {
                document.getElementById("priceError").innerText = errors.price;
            }

        });
    });

    // Fetch paginated data
    function fetchProducts(page) {

        fetch(`/api/products?page=${page}&size=${pageSize}`)

            .then(response => response.json())

            .then(data => {

                const tbody = document.getElementById("productTableBody");

                tbody.innerHTML = "";

                // Populate table
                data.content.forEach(product => {

                    const row = `<tr>
                        <td>${product.id}</td>
                        <td>${product.name}</td>
                        <td>$${product.price.toFixed(2)}</td>
                    </tr>`;

                    tbody.innerHTML += row;
                });

                // Update Pagination UI
                currentPage = data.number;

                document.getElementById("pageInfo").innerText =
                    `Page ${data.number + 1} of ${data.totalPages || 1}`;

                document.getElementById("prevBtn").disabled =
                    data.first;

                document.getElementById("nextBtn").disabled =
                    data.last;

            })

            .catch(error =>
                console.error('Error fetching products:', error)
            );
    }

    // Handle Pagination Buttons
    function changePage(direction) {
        fetchProducts(currentPage + direction);
    }
</script>
